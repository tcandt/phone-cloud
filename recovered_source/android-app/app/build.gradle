plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cloudphone.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cloudphone.app"
        minSdk 24
        targetSdk 34
        versionCode 36
        versionName "0.3.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Network & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Shizuku (No-Root shell execution via Binder UID 2000)
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:${shizuku_version}"
    implementation "dev.rikka.shizuku:provider:${shizuku_version}"

    // QR Code Scanning
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.register('bundleHostBinaries') {
    doLast {
        def assetsDir = file("src/main/assets")
        assetsDir.mkdirs()

        // 1. Android Helper (libsys_core.so)
        def helperFile = file("../../android-helper/build/outputs/apk/release/android-helper-release-unsigned.apk")
        if (!helperFile.exists()) {
            helperFile = file("../../../cloudphone-v0.3.6/agentd/libsys_core.so")
        }
        if (!helperFile.exists()) {
            helperFile = file("../../../cloudphone-v0.3.6/android/libsys_core.so")
        }
        if (helperFile.exists()) {
            copy {
                from helperFile
                into assetsDir
                rename { "libsys_core.so" }
            }
            println "[bundleHostBinaries] Bundled helper from: ${helperFile.path}"
        }

        // 2. CloudPhone Agent (cloudphone-agent arm64)
        def agentFile = file("../../cloudphone-agent/cloudphone-agent-arm64")
        if (!agentFile.exists()) {
            agentFile = file("../../../cloudphone-v0.3.6/agentd/cloudphone-agent-arm64")
        }
        if (!agentFile.exists()) {
            agentFile = file("../../../cloudphone-v0.3.6/android/cloudphone-agent")
        }
        if (agentFile.exists()) {
            copy {
                from agentFile
                into assetsDir
                rename { "cloudphone-agent" }
            }
            println "[bundleHostBinaries] Bundled agent from: ${agentFile.path}"
        }

        // 3. WebRTC Signaling Server (webrtc-signaling arm64)
        def sigFile = file("../../webrtc-signaling/webrtc-signaling-linux-arm64")
        if (!sigFile.exists()) {
            sigFile = file("../../../cloudphone-v0.3.6/bin/linux_arm64/webrtc-signaling")
        }
        if (!sigFile.exists()) {
            sigFile = file("../../../cloudphone-v0.3.6/android/webrtc-signaling")
        }
        if (sigFile.exists()) {
            copy {
                from sigFile
                into assetsDir
                rename { "webrtc-signaling" }
            }
            println "[bundleHostBinaries] Bundled signaling from: ${sigFile.path}"
        }
    }
}
preBuild.dependsOn 'bundleHostBinaries'
