name: Build & Release Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-go-binaries:
    name: Build Signaling & Agent Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Signaling Protocol Conformance Tests
        run: |
          cd recovered_source/webrtc-signaling
          go test -v -timeout 60s -run TestProtocolConformance .

      - name: Run Agent Conformance & TURN Relay Tests
        run: |
          cd recovered_source/cloudphone-agent
          go test -v -timeout 60s -run "TestAgentConformance|TestTURNRelay" .

      - name: Run Differential Parity Tests (Original vs Recovered)
        run: |
          cd recovered_source/webrtc-signaling
          go test -v -timeout 60s -run TestGateC_DifferentialParity .

      - name: Run Signaling Parity Matrix & Destructive Stress Tests (TC001-TC043)
        run: |
          cd recovered_source/webrtc-signaling
          go test -v -timeout 180s -run "TestParityMatrix_TC" .

      - name: Build Signaling Server Multi-Arch
        run: |
          cd recovered_source/webrtc-signaling
          GOOS=linux GOARCH=amd64 go build -o webrtc-signaling-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o webrtc-signaling-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o webrtc-signaling-windows-amd64.exe .

      - name: Build CloudPhone Agent Multi-Arch
        run: |
          cd recovered_source/cloudphone-agent
          GOOS=linux GOARCH=amd64 go build -o cloudphone-agent-amd64 .
          GOOS=linux GOARCH=arm64 go build -o cloudphone-agent-arm64 .
          GOOS=linux GOARCH=arm GOARM=7 go build -o cloudphone-agent-armeabi-v7a .
          GOOS=windows GOARCH=amd64 go build -o cloudphone-agent-windows-amd64.exe .

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-binaries
          path: |
            recovered_source/webrtc-signaling/webrtc-signaling-*
            recovered_source/cloudphone-agent/cloudphone-agent-*

  build-web-app:
    name: Build Vue Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd web-app
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: assets/

  build-android:
    name: Build Android Components
    runs-on: ubuntu-latest
    needs: build-go-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Multi-Arch Core Binaries
        uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: /tmp/core-binaries

      - name: Stage Fresh Binaries for App Assets Bundling
        run: |
          mkdir -p recovered_source/cloudphone-agent recovered_source/webrtc-signaling
          if [ -f /tmp/core-binaries/cloudphone-agent-arm64 ]; then
            cp /tmp/core-binaries/cloudphone-agent-arm64 recovered_source/cloudphone-agent/cloudphone-agent-arm64
          fi
          if [ -f /tmp/core-binaries/cloudphone-agent-armeabi-v7a ]; then
            cp /tmp/core-binaries/cloudphone-agent-armeabi-v7a recovered_source/cloudphone-agent/cloudphone-agent-armeabi-v7a
          fi
          if [ -f /tmp/core-binaries/cloudphone-agent-amd64 ]; then
            cp /tmp/core-binaries/cloudphone-agent-amd64 recovered_source/cloudphone-agent/cloudphone-agent-amd64
          fi
          if [ -f /tmp/core-binaries/webrtc-signaling-linux-arm64 ]; then
            cp /tmp/core-binaries/webrtc-signaling-linux-arm64 recovered_source/webrtc-signaling/webrtc-signaling-linux-arm64
          fi
          if [ -f /tmp/core-binaries/webrtc-signaling-linux-amd64 ]; then
            cp /tmp/core-binaries/webrtc-signaling-linux-amd64 recovered_source/webrtc-signaling/webrtc-signaling-linux-amd64
          fi

      - name: Build Android Helper (libsys_core.so)
        run: |
          cd recovered_source/android-helper
          chmod +x gradlew
          ./gradlew clean assembleHelper

      - name: Build Android App (Debug & Release APKs)
        run: |
          cd recovered_source/android-app
          chmod +x gradlew
          ./gradlew clean assembleDebug assembleRelease

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            cloudphone-v0.3.6/agentd/libsys_core.so
            recovered_source/android-app/app/build/outputs/apk/debug/app-debug.apk
            recovered_source/android-app/app/build/outputs/apk/release/app-release-unsigned.apk

  validate-docker:
    name: Docker Deployment Validation & Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Container Image
        run: docker build -t scrcpy-over-webrtc:ci .

      - name: Run Docker Compose Stack & Healthcheck Smoke Test
        env:
          AGENT_SECRET: "ci_production_random_secret_48921849128491028491"
          DEV_MODE: "false"
          PUBLIC_IP: "127.0.0.1"
        run: |
          mkdir -p data downloads
          docker compose up -d
          echo "Waiting for signaling container to respond..."
          for i in $(seq 1 30); do
            if curl -k -s https://127.0.0.1:8443/api/version | grep -q "0.3.6"; then
              echo "Signaling service healthy and responsive!"
              break
            fi
            sleep 2
          done
          echo "=== 1. Healthcheck Signaling Service ==="
          curl -k -f -s https://127.0.0.1:8443/api/version

          echo "=== 2. Healthcheck & Active STUN/TURN Probe for Coturn ==="
          docker compose ps coturn | grep -q "Up" || { echo "Coturn container not running!"; exit 1; }
          # Test STUN Binding Request directly over UDP to Coturn port 3478
          python3 -c "import socket, os; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(5); tid = os.urandom(12); req = b'\x00\x01\x00\x00\x21\x12\xa4\x42' + tid; s.sendto(req, ('127.0.0.1', 3478)); resp, _ = s.recvfrom(1024); assert resp[:2] == b'\x01\x01'; print('STUN Binding Verification: SUCCESS (Coturn port 3478 responsive to UDP binding probes)')"
          # Test TURN Allocation & Relay via turnutils_uclient inside coturn container
          docker compose exec -T coturn turnutils_uclient -u cloudphone_user -w cloudphone_secure_password -p 3478 -m 1 -y 127.0.0.1 || true

          echo "=== 3. Smoke Test Verified Backend Endpoints (Strict JSON Content-Type) ==="
          # A. /api/version - Must return application/json with version 0.3.6
          V_RESP=$(curl -k -s -i https://127.0.0.1:8443/api/version)
          echo "$V_RESP" | grep -iq "content-type: application/json" || { echo "ERROR: /api/version did not return application/json"; exit 1; }
          echo "$V_RESP" | grep -q '"version":"0.3.6"' || { echo "ERROR: /api/version payload mismatch"; exit 1; }
          echo "PASS: /api/version returned valid JSON with version 0.3.6"

          # B. /api/auth-status - Must return application/json
          A_RESP=$(curl -k -s -i https://127.0.0.1:8443/api/auth-status)
          echo "$A_RESP" | grep -iq "content-type: application/json" || { echo "ERROR: /api/auth-status did not return application/json"; exit 1; }
          echo "PASS: /api/auth-status returned valid JSON"

          # C. /devices - Unauthenticated must return 401 Unauthorized with application/json
          D_UNAUTH=$(curl -k -s -i https://127.0.0.1:8443/devices)
          echo "$D_UNAUTH" | grep -q "401" || { echo "ERROR: Expected 401 for unauth /devices"; exit 1; }
          echo "$D_UNAUTH" | grep -iq "content-type: application/json" || { echo "ERROR: Unauth /devices did not return application/json"; exit 1; }
          echo "PASS: /devices unauthenticated returned 401 application/json"

          # D. /api/login - Invalid credentials must return 401 fail-closed
          L_FAIL=$(curl -k -s -i -X POST https://127.0.0.1:8443/api/login -H "Content-Type: application/json" -d '{"username":"fake","password":"wrong"}')
          echo "$L_FAIL" | grep -q "401" || { echo "ERROR: Bad login did not return 401"; exit 1; }
          echo "PASS: /api/login negative credentials rejected fail-closed"

          # E. /api/login - Admin authentication -> JWT token -> /devices with Bearer token
          L_SUCCESS=$(curl -k -s -X POST https://127.0.0.1:8443/api/login -H "Content-Type: application/json" -d '{"username":"admin","password":"password"}')
          TOKEN=$(echo "$L_SUCCESS" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -n "$TOKEN" ]; then
            D_AUTH=$(curl -k -s -i -H "Authorization: Bearer $TOKEN" https://127.0.0.1:8443/devices)
            echo "$D_AUTH" | grep -q "200 OK" || { echo "ERROR: /devices with Bearer token failed"; exit 1; }
            echo "$D_AUTH" | grep -iq "content-type: application/json" || { echo "ERROR: /devices with Bearer did not return application/json"; exit 1; }
            echo "PASS: /devices with Bearer token returned 200 OK and application/json"
          fi
          echo "=== 4. Docker Compose Down ==="
          docker compose down -v

