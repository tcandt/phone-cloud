# Cloudphone Agent Configuration

# 是否自启动
ENABLED=true

# 填入信令服务地址（-signaling），必填
# 支持域名或 IP（例如：wss://cloudphone.example.com:8443 或 wss://192.168.1.5:8443）
# https 服务对应 wss://，http 服务对应 ws://
CP_AGENT_SIGNALING="wss://[信令服务器IP或域名]:8443"

# 填入中转服务器地址（-ice-servers），空则只能局域网直连
CP_AGENT_ICE_SERVERS=""

# 自定义设备ID，空则使用默认设备ID
CP_AGENT_ID=""

