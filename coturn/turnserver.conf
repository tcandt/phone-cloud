# Coturn TURN Server Configuration for ScrcpyOverWebRTC
listening-port=3478
fingerprint
lt-cred-mech

# Static credentials matching signaling ICE_SERVERS configuration
user=cloudphone_user:cloudphone_secure_password
realm=cloudphone

# Dynamic external-ip (defaults to loopback if not set; override via turnserver CLI or env)
external-ip=127.0.0.1

# UDP relay allocation port range
min-port=49152
max-port=65535

# Security and optimization parameters
stale-nonce=600
no-multicast-peers
no-cli
simple-log
syslog
verbose
